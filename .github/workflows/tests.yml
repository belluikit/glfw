name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['', 'stable']

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        go-version-file: go.mod

    - name: Get dependencies
      run: sudo apt-get update && sudo apt-get install gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

    - name: Tests
      run: go test -race ./...

  # Runs the Windows-only tests (gesture_windows_test.go, belluikit/glfw#13)
  # and builds the Win32 sources, which the Linux jobs never compile. It uses
  # a current Go: go.mod's minimum (1.19) cannot link its runtime's cgo
  # against the runner's MinGW gcc (undefined __imp___iob_func).
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Tests
      run: go test -count=1 -v ./...
